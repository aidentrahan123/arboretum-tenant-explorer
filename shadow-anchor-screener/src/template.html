<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow-Anchor Screener</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f0; --panel:#ffffff; --ink:#1d1d1b; --muted:#6b6862; --line:#e4e0d8;
  --accent:#1f4e79; --sel:#fff6dc; --poly:#1f4e79; --polysel:#d9822b;
  --target:#cc0000; --walmart:#0071ce; --lowes:#00427a; --homedepot:#f96302; --costco:#7a1f2b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --panel:#1f2226; --ink:#ece9e3; --muted:#9a968e; --line:#33373d;
    --accent:#8fb8e0; --sel:#3a3322; --poly:#8fb8e0; --polysel:#f0a050;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --panel:#1f2226; --ink:#ece9e3; --muted:#9a968e; --line:#33373d;
  --accent:#8fb8e0; --sel:#3a3322; --poly:#8fb8e0; --polysel:#f0a050;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:16px 20px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font:600 22px/1.2 Fraunces,Georgia,serif;margin:0}
.sub{color:var(--muted);margin-top:4px}
.sub q{font-style:italic}
.stats{display:flex;gap:18px;margin-top:10px;flex-wrap:wrap}
.stat b{font-size:18px;display:block}
.stat span{color:var(--muted);font-size:12px}
main{flex:1;display:flex;min-height:0}
aside{width:420px;max-width:100%;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0}
.controls{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="false"]{opacity:.45}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.toggle{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
#list{overflow:auto;flex:1}
.row{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:8px}
.row:hover{background:color-mix(in srgb,var(--sel) 50%,transparent)}
.row.sel{background:var(--sel)}
.rank{font:600 16px Fraunces,serif;color:var(--accent)}
.name{font-weight:600}
.name small{font-weight:400;color:var(--muted)}
.meta{color:var(--muted);font-size:12px}
.anchors{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:11px;padding:1px 7px;border-radius:4px;color:#fff;white-space:nowrap}
.tag.on{opacity:.75}
#detail{border-top:1px solid var(--line);padding:12px 14px;max-height:40%;overflow:auto;display:none}
#detail h2{font:600 17px Fraunces,serif;margin:0 0 4px}
#detail ul{margin:6px 0 0;padding-left:18px;columns:2;font-size:12px}
#map{flex:1;min-height:300px}
footer{font-size:11px;color:var(--muted);padding:8px 20px;border-top:1px solid var(--line);background:var(--panel)}
.amark{width:26px;height:26px;border-radius:50%;color:#fff;font:600 10px Inter,sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
@media (max-width:760px){
  main{flex-direction:column}
  aside{width:100%;height:50%;border-right:0;border-bottom:1px solid var(--line)}
  header{padding:12px 16px}
}
</style>
</head>
<body>
<header>
  <h1>Shadow-Anchor Screener: <span id="mkt"></span></h1>
  <div class="sub">Retail centers sitting next to a Target, Walmart, Lowe's, Home Depot or Costco. <q>Go follow the retailers.</q></div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <aside>
    <div class="controls" id="controls"></div>
    <div id="list"></div>
    <div id="detail"></div>
  </aside>
  <div id="map"></div>
</main>
<footer id="foot"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DATA=/*__DATA__*/null;
const BRAND={"Target":["--target","T"],"Walmart":["--walmart","W"],"Lowe's":["--lowes","L"],"Home Depot":["--homedepot","HD"],"Costco":["--costco","C"]};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const col=b=>css(BRAND[b][0]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

document.getElementById('mkt').textContent=DATA.market;
document.title='Shadow-Anchor Screener: '+DATA.market;
const shadowCt=DATA.centers.filter(c=>c.anchors.some(h=>!h.inside)).length;
document.getElementById('stats').innerHTML=[
  [DATA.anchors.length,'big-box anchors found'],
  [DATA.centers.length,'centers within ¼ mi of one'],
  [shadowCt,'with an anchor next door, not on site'],
].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
document.getElementById('foot').innerHTML=
 `Data: © OpenStreetMap contributors (pulled ${DATA.generated}). "Next door" means within ${DATA.params.shadow_mi} mi of the center's mapped edge. `+
 `"On site" means the anchor falls inside the center's mapped footprint, and often owns its own parcel. Ranking weights distinct anchor brands, anchors across the street, closeness, acreage and tenant depth. `+
 `Tenant lists come from OSM and are incomplete. This is a first-pass screen, not ownership, rent or traffic data.`;

// Map
const map=L.map('map',{zoomControl:true});
const dark=matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme!=='light';
const esri=(svc,max)=>L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/${svc}/MapServer/tile/{z}/{y}/{x}`,
  {attribution:'Tiles © Esri · Data © OpenStreetMap contributors',maxZoom:19,maxNativeZoom:max});
const base=esri(dark?'Canvas/World_Dark_Gray_Base':'Canvas/World_Light_Gray_Base',16).addTo(map);
const sat=esri('World_Imagery',19);
const layerCtl=L.control.layers({'Map':base,'Satellite':sat},null,{position:'topright'}).addTo(map);
let userPickedLayer=false;
layerCtl.getContainer().addEventListener('change',()=>{userPickedLayer=true;});
let ready=false;
map.on('baselayerchange',()=>{ if(ready) render(); });
function useSatellite(){ if(!userPickedLayer && !map.hasLayer(sat)){ map.removeLayer(base); sat.addTo(map);} }

const polys={};
DATA.centers.forEach(c=>{
  polys[c.id]=L.polygon(c.rings,{color:css('--poly'),weight:1.5,fillOpacity:.12})
    .addTo(map).on('click',()=>select(c.id,false));
});
DATA.anchors.forEach(a=>{
  const [v,ab]=BRAND[a.brand];
  L.marker([a.lat,a.lon],{icon:L.divIcon({className:'',html:`<div class="amark" style="background:${col(a.brand)}">${ab}</div>`,iconSize:[26,26],iconAnchor:[13,13]})})
   .bindTooltip(`${esc(a.name)}${a.addr?'<br>'+esc(a.addr):''}`).addTo(map);
});
const all=L.featureGroup(Object.values(polys));
map.fitBounds(all.getBounds().pad(.05));

// Controls
const on=Object.fromEntries(Object.keys(BRAND).map(b=>[b,true]));
let shadowOnly=false;
const ctr=document.getElementById('controls');
Object.keys(BRAND).forEach(b=>{
  const n=DATA.anchors.filter(a=>a.brand===b).length;
  const el=document.createElement('button');
  el.className='chip';el.setAttribute('aria-pressed','true');
  el.innerHTML=`<span class="dot" style="background:${col(b)}"></span>${esc(b)} ${n}`;
  el.onclick=()=>{on[b]=!on[b];el.setAttribute('aria-pressed',on[b]);render();};
  ctr.appendChild(el);
});
const tg=document.createElement('label');tg.className='toggle';
tg.innerHTML='<input type="checkbox"> Next-door anchor only';
tg.querySelector('input').onchange=e=>{shadowOnly=e.target.checked;render();};
ctr.appendChild(tg);

let selected=null;
function visible(c){
  const hits=c.anchors.filter(h=>on[h.brand]&&(!shadowOnly||!h.inside));
  return hits.length>0;
}
function tagHTML(h){
  return `<span class="tag ${h.inside?'on':''}" style="background:${col(h.brand)}">${esc(h.brand)} · ${h.inside?'on site':h.dist_ft.toLocaleString()+' ft'}</span>`;
}
function render(){
  const list=document.getElementById('list');
  const rows=DATA.centers.filter(visible);
  list.innerHTML=rows.map((c,i)=>`
    <div class="row ${c.id===selected?'sel':''}" data-id="${c.id}" tabindex="0">
      <div class="rank">${i+1}</div>
      <div>
        <div class="name">${esc(c.name)}${c.named?'':' <small>(unnamed in OSM)</small>'}</div>
        <div class="meta">${c.acres} ac · ${c.tenant_count} mapped tenants</div>
        <div class="anchors">${c.anchors.map(tagHTML).join('')}</div>
      </div>
    </div>`).join('') || '<div class="row"><div></div><div class="meta">No centers match these filters.</div></div>';
  list.querySelectorAll('.row[data-id]').forEach(r=>{
    r.onclick=()=>select(r.dataset.id,true);
    r.onkeydown=e=>{if(e.key==='Enter')select(r.dataset.id,true);};
  });
  DATA.centers.forEach(c=>{
    const p=polys[c.id], vis=visible(c);
    const onSat=map.hasLayer(sat);
    p.setStyle({opacity:vis?1:.15,fillOpacity:c.id===selected?(onSat?.18:.35):(vis?(onSat?.05:.12):.03),
      color:c.id===selected?css('--polysel'):(onSat?'#ffffff':css('--poly')),weight:c.id===selected?3:(onSat?2:1.5)});
  });
}
function select(id,zoom){
  selected=id;
  const c=DATA.centers.find(x=>x.id===id);
  if(zoom){ useSatellite(); map.fitBounds(polys[id].getBounds().pad(.6)); }
  const d=document.getElementById('detail');
  d.style.display='block';
  d.innerHTML=`<h2>${esc(c.name)}</h2>
    <div class="meta">${c.acres} acres mapped · <a href="https://www.openstreetmap.org/${c.id}" target="_blank" rel="noopener">OSM ${c.id}</a> · <a href="https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lon}" target="_blank" rel="noopener">Google Maps</a></div>
    <div class="anchors" style="margin-top:6px">${c.anchors.map(tagHTML).join('')}</div>
    ${c.tenants.length?`<div class="meta" style="margin-top:8px">Mapped tenants (${c.tenant_count})</div><ul>${c.tenants.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}`;
  render();
  document.querySelector(`.row[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({block:'nearest'});
}
ready=true;
render();
</script>
</body>
</html>
